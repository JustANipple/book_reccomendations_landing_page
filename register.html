<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="authentication.css" />
  </head>
  <body class="layoutBody">
    <header class="layoutHeader">
      <nav class="homepageNav">
        <div class="navLeft">
          <a asp-controller="Home" asp-action="Homepage">
            <img
              src="/Images/logoplaceholder.svg"
              alt="Book recommender logo"
              class="leftLogo"
            />
          </a>
          <a
            class="leftTitle"
            asp-area=""
            asp-controller="Home"
            asp-action="Homepage"
            >Book reccomendations</a
          >
        </div>
        <div class="navRight">
          <ul class="rightList">
            <li>
              <a class="" asp-area="" asp-controller="" asp-action="">Try AI</a>
            </li>
            <li>
              <a class="" asp-area="" asp-controller="" asp-action=""
                >Reccomendations</a
              >
            </li>
            <li>
              <a class="" asp-area="" asp-controller="" asp-action="">Books</a>
            </li>
            <li>
              <a
                class=""
                asp-area=""
                asp-controller="Account"
                asp-action="Profile"
                >Profile</a
              >
            </li>
          </ul>
          <!-- TODO: Implementare la condizione per cui viene mostrato o il login o il logout -->
          <a class="loginButton" asp-area="" asp-controller="" asp-action=""
            >Login</a
          >
          <!-- <a class="logoutButton" asp-area="" asp-controller="" asp-action=""
            >Logout</a
          > -->
        </div>
      </nav>
    </header>

    <div class="homepageIntro">
      <div class="introLeft">
        <img src="./Images/topo.svg" alt="topo" />
      </div>
      <div class="introRight">
        <div class="rightContainer">
          <div class="rightIntro">
            <h1 class="introTitle">Welcome to Book Recommender</h1>
            <p class="introSubtitle">Insert your credentials</p>
          </div>
          <form action="" class="registerForm">
            <label for="name" class="nameLabel">
              Name
              <input
                type="text"
                id="name"
                placeholder="Name"
                class="nameInput"
              />
            </label>
            <label for="email" class="emailLabel">
              Email
              <input
                type="email"
                id="email"
                placeholder="Email"
                class="emailInput"
              />
            </label>
            <label for="password" class="passwordLabel">
              Password
              <input
                type="password"
                id="password"
                placeholder="Password"
                class="passwordInput"
              />
            </label>
            <label for="confirmPassword" class="confirmPasswordLabel">
              Password
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                class="confirmPasswordInput"
              />
            </label>
            <button type="submit" class="registerSubmit">Register</button>
            <p class="registerParagraph">
              Already a member?
              <a href="login.html" class="registerButton">Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <footer class="layoutFooter">
      <a class="footerTitle" asp-area="" asp-controller="" asp-action=""
        >Book reccomendations</a
      >
      <p class="footerParagraph">
        © 2025 Book reccomendations. All rights reserved. Powered by Arianna
      </p>
    </footer>
  </body>
</html>
